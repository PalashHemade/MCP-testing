[project]
name = "logistics-ai-backend"
version = "0.1.0"
description = "AI-powered logistics management chatbot backend (FastAPI + Gemini + MCP)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "google-genai==2.33.0",
    "mcp==1.30.0",
    "pgvector==0.3.6",
    "PyJWT==2.10.1",
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "greenlet==3.1.1",
    "numpy==2.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:.*event_loop fixture.*:DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
